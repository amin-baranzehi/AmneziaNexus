{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>System Logs - AmneziaNexus</title>
    <link rel="icon" type="image/x-icon" href="{% static 'vpn_panel/icons/app_icon.ico' %}">
    <link rel="shortcut icon" href="{% static 'vpn_panel/icons/app_icon.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'vpn_panel/icons/app_icon.png' %}">
    <script src="{% static 'vpn_panel/js/tailwind.js' %}"></script>
    <link rel="stylesheet" href="{% static 'vpn_panel/css/inter.css' %}">
    <link rel="stylesheet" href="{% static 'vpn_panel/css/styles.css' %}">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <nav class="bg-panel border-b border-gray-700/80 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 sm:h-16 gap-2">
                <!-- Brand & Status -->
                <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                    <a href="{% url 'vpn_panel:dashboard' %}" class="flex items-center gap-1.5 sm:gap-2.5 text-base sm:text-xl font-bold text-accent tracking-wide hover:opacity-90 transition flex-shrink-0">
                        <img src="{% static 'vpn_panel/icons/app_icon.png' %}" alt="Logo" class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 rounded-lg object-contain shadow-sm">
                        <span class="truncate">AmneziaNexus</span>
                    </a>
                    <div class="flex items-center flex-shrink-0">
                        <span class="inline-flex items-center px-1.5 sm:px-2.5 py-0.5 rounded-full text-[11px] sm:text-xs font-medium {% if is_system_connected %}bg-emerald-950/70 text-emerald-400 border border-emerald-700/70{% else %}bg-gray-800/80 text-gray-400 border border-gray-700{% endif %}" title="{% if is_system_connected %}System is Running{% else %}System is Stopped{% endif %}">
                            <span class="w-1.5 h-1.5 rounded-full {% if is_system_connected %}bg-emerald-400 animate-pulse{% else %}bg-gray-500{% endif %} sm:mr-1.5"></span>
                            <span class="hidden xs:inline">{% if is_system_connected %}Running{% else %}Stopped{% endif %}</span>
                        </span>
                    </div>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-1.5 sm:gap-2.5 flex-shrink-0">
                    <a href="{% url 'vpn_panel:dashboard' %}" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-lg transition duration-150 shadow-sm" title="Back to Dashboard">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span class="hidden sm:inline">Dashboard</span>
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 bg-gray-800/90 hover:bg-gray-700 text-gray-300 text-xs sm:text-sm font-medium rounded-lg transition duration-150 border border-gray-700" title="Sign Out">
                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            <span class="hidden sm:inline">Logout</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8">
        
        <!-- VPN Logs Section -->
        <div class="mb-6 sm:mb-8">
            <div class="flex items-center justify-between gap-2 mb-2 sm:mb-3">
                <h2 class="text-sm sm:text-base md:text-lg font-bold text-gray-100 flex items-center gap-2 truncate">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0"></span>
                    <span class="truncate">VPN Connection Logs</span>
                    <span class="text-[11px] sm:text-xs text-gray-400 font-mono font-normal hidden xs:inline">(awg-quick)</span>
                </h2>
                <button onclick="window.location.reload();" class="text-xs text-gray-400 hover:text-indigo-400 flex items-center gap-1 transition flex-shrink-0 px-2 py-1 bg-gray-800/70 hover:bg-gray-800 rounded-md border border-gray-700/70">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Refresh</span>
                </button>
            </div>
            <div id="vpn-logs-container" class="bg-black/90 p-3 sm:p-4 rounded-xl border border-gray-700/80 overflow-x-auto shadow-inner custom-scrollbar" style="max-height: 340px; overflow-y: auto;">
                <pre class="text-emerald-400 text-xs sm:text-sm font-mono whitespace-pre-wrap break-all sm:break-normal">{{ vpn_logs }}</pre>
            </div>
        </div>

        <!-- System Logs Section -->
        <div class="mb-6 sm:mb-8">
            <div class="flex items-center justify-between gap-2 mb-2 sm:mb-3">
                <h2 class="text-sm sm:text-base md:text-lg font-bold text-gray-100 flex items-center gap-2 truncate">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 flex-shrink-0"></span>
                    <span class="truncate">Panel Service Logs</span>
                    <span class="text-[11px] sm:text-xs text-gray-400 font-mono font-normal hidden xs:inline">(journalctl)</span>
                </h2>
            </div>
            <div id="sys-logs-container" class="bg-black/90 p-3 sm:p-4 rounded-xl border border-gray-700/80 overflow-x-auto shadow-inner custom-scrollbar" style="max-height: 340px; overflow-y: auto;">
                <pre class="text-gray-300 text-xs sm:text-sm font-mono whitespace-pre-wrap break-all sm:break-normal">{{ sys_logs }}</pre>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-4 sm:py-6 text-center text-gray-500 text-xs sm:text-sm border-t border-gray-800/80 bg-panel">
        <p>Developed by <a href="https://github.com/amin-baranzehi" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline font-medium">Amin Baranzehi</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const vpnContainer = document.getElementById('vpn-logs-container');
            const sysContainer = document.getElementById('sys-logs-container');
            if (vpnContainer) vpnContainer.scrollTop = vpnContainer.scrollHeight;
            if (sysContainer) sysContainer.scrollTop = sysContainer.scrollHeight;
        });
    </script>
</body>
</html>
