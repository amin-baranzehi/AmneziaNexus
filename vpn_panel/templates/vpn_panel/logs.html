{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - AmneziaNexus</title>
    <script src="{% static 'vpn_panel/js/tailwind.js' %}"></script>
    <link rel="stylesheet" href="{% static 'vpn_panel/css/inter.css' %}">
    <link rel="stylesheet" href="{% static 'vpn_panel/css/styles.css' %}">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <nav class="bg-panel border-b border-gray-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="{% url 'vpn_panel:dashboard' %}" class="text-2xl font-bold text-accent tracking-wider hover:opacity-80 transition">AmneziaNexus</a>
                    <div class="hidden md:flex space-x-2">
                        <span class="px-3 py-1 rounded-md text-sm font-medium {% if is_system_connected %}bg-green-900/50 text-green-400 border border-green-700{% else %}bg-gray-800 text-gray-400 border border-gray-700{% endif %}">
                            {% if is_system_connected %}Running{% else %}Stopped{% endif %}
                        </span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{% url 'vpn_panel:dashboard' %}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-md transition duration-200">
                        Back to Dashboard
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded-md transition duration-200 border border-gray-700">
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8">
            <h2 class="text-xl font-semibold text-gray-200 mb-4">VPN Kernel Logs (dmesg)</h2>
            <div id="vpn-logs-container" class="bg-black p-4 rounded-md border border-gray-700 overflow-x-auto shadow-inner custom-scrollbar" style="max-height: 400px; overflow-y: auto;">
                <pre class="text-green-400 text-sm font-mono whitespace-pre-wrap">{{ vpn_logs }}</pre>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-xl font-semibold text-gray-200 mb-4">Panel Service Logs (journalctl)</h2>
            <div id="sys-logs-container" class="bg-black p-4 rounded-md border border-gray-700 overflow-x-auto shadow-inner custom-scrollbar" style="max-height: 400px; overflow-y: auto;">
                <pre class="text-gray-300 text-sm font-mono whitespace-pre-wrap">{{ sys_logs }}</pre>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center text-gray-500 text-sm border-t border-gray-800">
        <p>Developed by <span class="text-accent">Amin Baranzehi</span></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const vpnContainer = document.getElementById('vpn-logs-container');
            const sysContainer = document.getElementById('sys-logs-container');
            if (vpnContainer) vpnContainer.scrollTop = vpnContainer.scrollHeight;
            if (sysContainer) sysContainer.scrollTop = sysContainer.scrollHeight;
        });
    </script>
</body>
</html>
